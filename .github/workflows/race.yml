name: Race

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - run: go mod tidy

      - name: Race detector (core packages)
        run: |
          go test -race -count=1 ./lib/validate/... ./redis/parser/... ./acl/... ./aof/... ./tcp/... ./database/...
