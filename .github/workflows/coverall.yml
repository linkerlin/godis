# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go
#
# R4-2 note (远期非目标 / 观察式门槛说明，非 CI fail gate)：
# - coveralls 上传 profile.cov 仅供趋势观察；不设百分比硬门槛、不因覆盖率
#   下降 fail job、不阻塞合并。勿在本文件引入 coverage-threshold / fail_ci_if_error。
# - 目标包列表（观察冲高，非 -coverpkg 门禁）：aof、pubsub、redis/protocol、
#   redis/connection、lib/hashslot；以及 datastruct 新类型（json/vector/
#   timeseries/hll 等）。本地可单独：go test -cover ./aof ./pubsub ./redis/protocol
#   ./redis/connection ./lib/hashslot（勿把 -coverpkg 门槛接到 CI fail）。
# - 「可接受覆盖」无数值门禁；专项冲高 ≠ 本 workflow 会红灯。
# R4-1 note: Redis 8 sidecar 在下方 redis-action 已起服务；**allowlist**
# 脚手架（String+Hash+List allowlist，见 scripts/redis-sidecar-diff.*）在 smoke
# 步真实可跑；完整输出 diff 套件未接入、亦不宣称。本地：
# bash scripts/redis-sidecar-diff.sh 或 pwsh scripts/redis-sidecar-diff.ps1；
# 无双端时 --selfcheck / -SelfCheck。

name: Go

on:
  push:
    branches: [ "master", "github-actions" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: zhulik/redis-action@1.1.0
      with:
        redis version: '8'
        number of databases: 16

    - uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v7
      with:
        version: v2.6.0

    - run: go mod tidy
    - run: go vet ./...

    - run: go build -o godis ./

    - name: Smoke test godis
      run: |
        CONFIG=scripts/ci-smoke.conf ./godis &
        echo $! > godis.pid
        sleep 2
        bash scripts/smoke-test.sh
        # R4-1: allowlist-only vs Redis sidecar (not a full compat suite).
        REDIS_HOST=127.0.0.1 REDIS_PORT=6379 GODIS_HOST=127.0.0.1 GODIS_PORT=6399 \
          bash scripts/redis-sidecar-diff.sh
        kill "$(cat godis.pid)"

    - name: R4-1 sidecar selfcheck
      run: bash scripts/redis-sidecar-diff.sh --selfcheck

    - run: go test -v -coverprofile=profile.cov ./...
    - run: go test -race ./lib/validate/... ./redis/parser/... ./acl/... ./aof/...

    - uses: shogo82148/actions-goveralls@v1
      with:
        path-to-profile: profile.cov
