# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go
#
# R4-2 note (远期非目标): coveralls 上传 profile.cov 仅供趋势观察，
# 不设覆盖率门槛、不阻塞合并。专项冲高覆盖率不在本里程碑内。
# R4-1 note: Redis 8 sidecar 在下方 redis-action 已起服务；完整输出 diff
# 套件未接入。可选本地：bash scripts/redis-sidecar-diff.sh（allowlist only）。

name: Go

on:
  push:
    branches: [ "master", "github-actions" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: zhulik/redis-action@1.1.0
      with:
        redis version: '8'
        number of databases: 16

    - uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v7
      with:
        version: v2.6.0

    - run: go mod tidy
    - run: go vet ./...

    - run: go build -o godis ./

    - name: Smoke test godis
      run: |
        CONFIG=scripts/ci-smoke.conf ./godis &
        echo $! > godis.pid
        sleep 2
        bash scripts/smoke-test.sh
        kill "$(cat godis.pid)"

    - run: go test -v -coverprofile=profile.cov ./...
    - run: go test -race ./lib/validate/... ./redis/parser/... ./acl/... ./aof/...

    - uses: shogo82148/actions-goveralls@v1
      with:
        path-to-profile: profile.cov
