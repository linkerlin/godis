name: Race

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - run: go mod tidy

      - name: Race detector (all packages, shuffled)
        run: |
          go test -race -count=1 -shuffle=on -timeout 30m ./...
